<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — X-VAULT</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0b0b0f;
        color: #e5e5e5;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      a {
        display: inline-block;
        background: #6d28d9;
        color: #fff;
        text-decoration: none;
        padding: 0.6rem 1.4rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Check your internet connection and try again.</p>
      <a
        href="/"
        onclick="
          location.reload();
          return false;
        "
        >Retry</a
      >
    </div>
  </body>
</html>
